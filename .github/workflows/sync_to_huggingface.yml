name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Allows manual triggers from GitHub UI
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push Code to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure remote and force push to HF space
          # Defaulting Space name to SmartGenzAI1/llm to match Github repo name.
          # If your Hugging Face Space has a different username/slug, update it below.
          git remote add hf https://huggingface.co/spaces/SmartGenzAI1/llm || true
          git push --force https://SmartGenzAI1:$HF_TOKEN@huggingface.co/spaces/SmartGenzAI1/llm main
